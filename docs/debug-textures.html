<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf3D Debug — Textures</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #111417;
            --panel: #1b232b;
            --line: #2e3b47;
            --text: #e6ebf0;
            --muted: #95a3b2;
            --accent: #d0b55b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(208, 181, 91, 0.14), transparent 42%),
                linear-gradient(180deg, #14181d 0%, var(--bg) 100%);
            color: var(--text);
            font: 14px/1.45 monospace;
        }
        header {
            padding: 24px 28px 12px;
        }
        h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }
        p {
            margin: 0;
            color: var(--muted);
        }
        main {
            padding: 12px 28px 32px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
        }
        .card {
            padding: 12px;
            background: rgba(27, 35, 43, 0.9);
            border: 1px solid var(--line);
        }
        canvas {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            image-rendering: pixelated;
            background: #000;
            border: 1px solid #000;
        }
        .meta {
            margin-top: 10px;
            display: grid;
            gap: 2px;
        }
        .tile {
            color: var(--accent);
            font-weight: 700;
        }
        .label {
            color: var(--text);
        }
        .group {
            color: var(--muted);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <header>
        <h1>Canvas 2D Painted Textures</h1>
        <p>Debug galerie aktuálně registrovaných wall a door painterů.</p>
    </header>
    <main>
        <section class="grid" id="grid"></section>
    </main>
    <script type="module">
        import { TEXTURE_SIZE, textureGenerator } from '../src/textures/TextureGenerator.js';

        const manifest = textureGenerator.getManifest();
        textureGenerator.preload(manifest.map((entry) => entry.tileType));

        const grid = document.getElementById('grid');

        function renderPixels(target, pixels) {
            const ctx = target.getContext('2d');
            const imageData = ctx.createImageData(TEXTURE_SIZE, TEXTURE_SIZE);
            new Uint32Array(imageData.data.buffer).set(pixels);
            ctx.putImageData(imageData, 0, 0);
        }

        for (const entry of manifest) {
            const card = document.createElement('article');
            card.className = 'card';

            const canvas = document.createElement('canvas');
            canvas.width = TEXTURE_SIZE;
            canvas.height = TEXTURE_SIZE;
            renderPixels(canvas, textureGenerator.paintTexture(entry.tileType));

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.innerHTML = `
                <div class="tile">${entry.tileType}</div>
                <div class="label">${entry.label}</div>
                <div class="group">${entry.group}</div>
            `;

            card.append(canvas, meta);
            grid.append(card);
        }
    </script>
</body>
</html>
